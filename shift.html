<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .dropdown-menu {
            transition: all 0.3s ease-in-out;
        }
        .dropdown-menu.hidden {
            opacity: 0;
            transform: translateY(-10px);
        }
        .dropdown-menu:not(.hidden) {
            opacity: 1;
            transform: translateY(0);
        }
        .shift-option:hover {
            background-color: #374151;
            transform: scale(1.02);
            transition: all 0.2s ease;
        }
        .error-alert {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }
        .card {
            background: linear-gradient(145deg, #1f2937, #111827);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div x-data="{
        selectedShift: '',
        isOpen: false,
        errorMessage: '',
        checkShiftTime(shift) {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTime = currentHour + (currentMinutes / 60);
            const afternoonStart = 13; // 1:00 PM
            if (shift === 'Afternoon' && currentTime < afternoonStart) {
                this.errorMessage = 'Not yet time for Afternoon shift! It starts at 1:00 PM.';
                return false;
            }
            if (shift === 'Morning' && currentTime >= afternoonStart) {
                this.errorMessage = 'Morning shift is over! It ends at 1:00 PM.';
                return false;
            }
            this.errorMessage = '';
            return true;
        }
    }" class="w-full max-w-md p-8 card rounded-2xl">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-100">Select Your Shift</h1>
        <div class="relative">
            <button 
                @click="isOpen = !isOpen" 
                class="w-full bg-gray-700 text-left px-5 py-3 rounded-xl shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 flex justify-between items-center hover:bg-gray-600 transition duration-200"
            >
                <span x-text="selectedShift || 'Choose a shift'" class="text-gray-200"></span>
                <svg class="w-5 h-5 transform transition-transform duration-300" :class="{ 'rotate-180': isOpen }" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
            <div 
                x-show="isOpen" 
                @click.away="isOpen = false" 
                class="dropdown-menu absolute w-full mt-2 bg-gray-700 rounded-xl shadow-xl z-10 border border-gray-600"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 transform scale-95"
                x-transition:enter-end="opacity-100 transform scale-100"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100 transform scale-100"
                x-transition:leave-end="opacity-0 transform scale-95"
            >
                <div 
                    @click="if (checkShiftTime('Morning')) { selectedShift = 'Morning'; isOpen = false; }" 
                    class="shift-option px-5 py-3 cursor-pointer text-gray-200 hover:text-blue-400 rounded-t-xl"
                >
                    Morning
                </div>
                <div 
                    @click="if (checkShiftTime('Afternoon')) { selectedShift = 'Afternoon'; isOpen = false; }" 
                    class="shift-option px-5 py-3 cursor-pointer text-gray-200 hover:text-blue-400"
                >
                    Afternoon
                </div>
                <div 
                    @click="selectedShift = 'No Shift (Full Time)'; isOpen = false; errorMessage = ''" 
                    class="shift-option px-5 py-3 cursor-pointer text-gray-200 hover:text-blue-400 rounded-b-xl"
                >
                    No Shift (Full Time)
                </div>
            </div>
        </div>
        <div x-show="errorMessage" class="mt-6 p-4 bg-red-600 text-white rounded-xl text-center font-bold error-alert shadow-md">
            <p x-text="errorMessage"></p>
        </div>
        <div x-show="selectedShift && !errorMessage" class="mt-6 text-center">
            <p class="text-lg text-gray-200">You selected: <span class="font-semibold text-blue-400" x-text="selectedShift"></span></p>
            <button 
                @click="selectedShift = ''; isOpen = false; errorMessage = ''" 
                class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl shadow-lg transition duration-200"
            >
                Clear Selection
            </button>
        </div>
        <div class="mt-8 text-center">
            <p class="text-gray-500 text-sm">Sleek shift selection with time validation</p>
        </div>
    </div>
</body>
</html>
